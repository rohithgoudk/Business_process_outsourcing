/* =========================================================
   SIGNED-IN USER LOOKUP
   Same behaviour as before: the usual key names in
   localStorage then sessionStorage, a JSON object or a bare
   address, nested objects, then a sweep of every stored key.
   ========================================================= */
const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
const USER_KEY_CANDIDATES = [
  'user', 'currentUser', 'loggedInUser', 'authUser', 'stacklyUser',
  'userData', 'profile', 'account', 'auth', 'session',
  'userEmail', 'email', 'username'
];
const EMAIL_FIELDS = ['email', 'mail', 'useremail', 'emailaddress', 'e-mail', 'username', 'login', 'user'];
const NAME_FIELDS = ['name', 'fullname', 'displayname', 'firstname', 'givenname'];
const ROLE_FIELDS = ['role', 'userrole', 'accounttype', 'type'];
let foundUserKey = null;

function asEmail(v) {
  if (typeof v !== 'string') return null;
  const s = v.trim();
  return EMAIL_RE.test(s) ? s : null;
}
function objToUser(obj, depth) {
  depth = depth || 0;
  if (!obj || depth > 4) return null;
  if (typeof obj === 'string') {
    const direct = asEmail(obj);
    if (direct) return { email: direct };
    return rawToUser(obj, depth + 1);
  }
  if (Array.isArray(obj)) {
    for (let i = 0; i < obj.length; i++) {
      const hit = objToUser(obj[i], depth + 1);
      if (hit) return hit;
    }
    return null;
  }
  if (typeof obj !== 'object') return null;
  for (const k in obj) {
    if (EMAIL_FIELDS.indexOf(String(k).toLowerCase()) === -1) continue;
    const hit = asEmail(obj[k]);
    if (hit) return Object.assign({}, obj, { email: hit });
  }
  for (const k in obj) {
    const hit = asEmail(obj[k]);
    if (hit) return Object.assign({}, obj, { email: hit });
  }
  for (const k in obj) {
    const v = obj[k];
    if (v && typeof v === 'object') {
      const nested = objToUser(v, depth + 1);
      if (nested) return nested;
    } else if (typeof v === 'string' && (v.trim().charAt(0) === '{' || v.trim().charAt(0) === '[')) {
      const nested = rawToUser(v, depth + 1);
      if (nested) return nested;
    }
  }
  return null;
}
function rawToUser(raw, depth) {
  depth = depth || 0;
  if (!raw || depth > 4) return null;
  const trimmed = String(raw).trim();
  if (!trimmed) return null;
  const first = trimmed.charAt(0);
  if (first === '{' || first === '[' || first === '"') {
    try { return objToUser(JSON.parse(trimmed), depth); } catch (e) {}
  }
  const direct = asEmail(trimmed);
  if (direct) return { email: direct };
  try { return objToUser(JSON.parse(trimmed), depth); } catch (e) { return null; }
}
function pickField(obj, fields) {
  if (!obj || typeof obj !== 'object') return '';
  for (const k in obj) {
    if (fields.indexOf(String(k).toLowerCase()) === -1) continue;
    const v = obj[k];
    if (typeof v === 'string' && v.trim() && !asEmail(v)) return v.trim();
  }
  return '';
}
function getCurrentUser() {
  const stores = [];
  try { if (window.localStorage) stores.push(localStorage); } catch (e) {}
  try { if (window.sessionStorage) stores.push(sessionStorage); } catch (e) {}
  for (let s = 0; s < stores.length; s++) {
    try { if (stores[s].getItem('isAuthenticated') === 'false') return null; } catch (e) {}
  }
  for (let s = 0; s < stores.length; s++) {
    for (let i = 0; i < USER_KEY_CANDIDATES.length; i++) {
      const key = USER_KEY_CANDIDATES[i];
      let hit = null;
      try { hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
      if (hit) { foundUserKey = key; return hit; }
    }
  }
  for (let s = 0; s < stores.length; s++) {
    let len = 0;
    try { len = stores[s].length; } catch (e) {}
    for (let i = 0; i < len; i++) {
      let key = null, hit = null;
      try { key = stores[s].key(i); hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
      if (hit) { foundUserKey = key; return hit; }
    }
  }
  return null;
}

function money(n) { return "$" + n.toLocaleString(); }
function moneyShort(n) { return n >= 1000000 ? "$" + (n / 1000000).toFixed(2) + "m" : "$" + Math.round(n / 1000) + "k"; }
function go404() { window.location.href = "404.html"; }
function lineTag(l) { const c = lineAccents[l] || "#2ee6c8"; return `<span class="line-tag" style="--c:${c}">${l}</span>`; }
function pill(text) { return `<span class="pill ${stateClass[text] || 'is-quiet'}">${text}</span>`; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---- sticky header height, measured whenever it can re-wrap ---- */
function syncTopbarHeight() {
  const tb = document.getElementById('topbar');
  if (!tb) return;
  const h = tb.offsetHeight;
  if (h) document.documentElement.style.setProperty('--head-h', h + 'px');
}

function fillBars() {
  requestAnimationFrame(function () {
    document.querySelectorAll('[data-w]').forEach(function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
    document.querySelectorAll('[data-dash]').forEach(function (el) { el.style.strokeDashoffset = el.getAttribute('data-dash'); });
  });
}
function entrance() {
  if (typeof gsap === 'undefined') return;
  gsap.killTweensOf('.stat, .panel, .anim');
  gsap.fromTo('.page-head', { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' });
  gsap.fromTo('.stat', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', stagger: 0.05 });
  gsap.fromTo('.panel', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', stagger: 0.06, delay: 0.06 });
  gsap.fromTo('.anim', { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out', stagger: 0.03, delay: 0.14 });

  document.querySelectorAll('.count').forEach(function (el) {
    const raw = el.textContent.trim();
    const match = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
    if (!match) return;
    const prefix = match[1], numStr = match[2].replace(/,/g, ''), suffix = match[3];
    const num = parseFloat(numStr);
    if (isNaN(num)) return;
    const decimals = numStr.indexOf('.') > -1 ? numStr.split('.')[1].length : 0;
    const counter = { val: 0 };
    gsap.to(counter, {
      val: num, duration: 1.05, ease: 'power2.out', delay: 0.1,
      onUpdate: function () { el.textContent = prefix + (decimals ? counter.val.toFixed(decimals) : Math.round(counter.val).toLocaleString()) + suffix; },
      onComplete: function () { el.textContent = raw; }
    });
  });
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ---------- shared pieces ---------- */
function statStrip(items) {
  return `<section class="stats">${items.map(function (s) {
    return `<div class="stat" onclick="go404()" style="--c:${s.color || '#2ee6c8'}">
      <span class="stat-label">${s.label}</span>
      <span class="stat-value count">${s.value}</span>
      ${s.note ? `<span class="stat-note">${s.note}</span>` : ''}
    </div>`;
  }).join("")}</section>`;
}
function panel(o, body) {
  return `<section class="panel ${o.cls || ''}">
    <header class="panel-head">
      <div>
        ${o.kicker ? `<span class="panel-kicker">${o.kicker}</span>` : ''}
        <h2>${o.title}</h2>
        ${o.sub ? `<p${o.subId ? ` id="${o.subId}"` : ''}>${o.sub}</p>` : ''}
      </div>
      ${o.aside || ''}
    </header>
    ${body}
  </section>`;
}
function ring(pct, color, label) {
  const r = 34, c = 2 * Math.PI * r;
  return `<div class="ring">
    <svg viewBox="0 0 80 80" aria-hidden="true">
      <circle cx="40" cy="40" r="${r}" class="ring-bg"/>
      <circle cx="40" cy="40" r="${r}" class="ring-fg" stroke="${color}" stroke-dasharray="${c.toFixed(1)}" style="stroke-dashoffset:${c.toFixed(1)}" data-dash="${(c * (1 - pct / 100)).toFixed(1)}"/>
    </svg>
    <span class="ring-val">${pct}%</span>
    ${label ? `<span class="ring-label">${label}</span>` : ''}
  </div>`;
}
function trailHtml(list) {
  return list.map(function (a) {
    return `<li class="trail-item anim" onclick="go404()">
      <span class="trail-dot ${a.actor === 'System' ? 'auto' : a.actor === 'Admin (You)' ? 'you' : ''}"></span>
      <span class="trail-body">
        <span class="trail-line"><b>${esc(a.actor)}</b> ${esc(a.action.toLowerCase())} — ${esc(a.target)}</span>
        <span class="trail-meta">${a.time} · ${a.scope}</span>
      </span>
    </li>`;
  }).join("");
}

function peopleTerms() { return state.peopleSearch.toLowerCase().split(/\s+/).filter(Boolean); }

  return people.filter(function (p) {

    return terms.every(function (t) { return hay.indexOf(t) > -1; });

function peopleRowsHtml(list) {

    return `<tr class="anim" onclick="go404()">
      <td class="stack" data-label="Client"><span class="t-name">${b.client}</span><span class="t-sub">${b.model}</span></td>
      <td data-label="Monthly value"><div class="mini"><span class="mini-track"><span class="mini-fill" data-w="${max ? Math.round(b.monthly / max * 100) : 0}"></span></span><span class="mini-num">${money(b.monthly)}</span></div></td>
      <td data-label="Next invoice">${b.next}</td>
      <td data-label="Payment">${pill(b.state)}</td>
    </tr>`;
  }).join("");
  return `${stats}${panel({ kicker: "Income", title: "Invoice ledger", sub: "Billing model, value and due date by client", cls: "panel-table" },
    `<div class="table-wrap"><table class="ledger">
      <thead><tr><th>Client</th><th>Monthly value</th><th>Next invoice</th><th>Payment</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`)}`;
}

/* =========================================================
   SECURITY
   ========================================================= */
function switchHtml(id, value) {
  return `<span class="switch ${value ? 'on' : ''}" data-toggle="${id}" role="switch" aria-checked="${value}" tabindex="0"><span class="switch-knob"></span></span>`;
}
function renderSecurity() {
  const s = state.settings;
  return `<div class="layout layout-even">
    ${panel({ kicker: "Policy", title: "Access policy", sub: "Applied to everyone with a login" },
      `<div class="pref"><div><span class="pref-title">Two-factor for leads and admins</span><span class="pref-desc">Required at every sign-in, no exceptions</span></div>${switchHtml("twoFactor", s.twoFactor)}</div>
      <div class="pref"><div><span class="pref-title">Single sign-on only</span><span class="pref-desc">Staff sign in through the company identity provider</span></div>${switchHtml("ssoRequired", s.ssoRequired)}</div>
      <div class="pref"><div><span class="pref-title">Site IP allowlist</span><span class="pref-desc">Only allow sign-ins from the four delivery centres</span></div>${switchHtml("ipAllowlist", s.ipAllowlist)}</div>
      <div class="pref pref-last"><div><span class="pref-title">Client data walls</span><span class="pref-desc">Agents only see the clients they are assigned to</span></div>${switchHtml("clientWalls", s.clientWalls)}</div>`)}
    <div class="stack-col">
      ${panel({ kicker: "Sessions", title: "Session policy", sub: "How long an idle session stays signed in" },
        `<div class="pref pref-last"><div><span class="pref-title">Automatic sign-out</span><span class="pref-desc">Applies to every account</span></div>
        <select class="pref-select" id="timeout-select">${["15 minutes","30 minutes","1 hour","4 hours"].map(function(t){return `<option ${s.sessionTimeout===t?'selected':''}>${t}</option>`;}).join("")}</select></div>`)}
      ${panel({ kicker: "Danger", title: "Company-wide actions", sub: "These take effect immediately for everyone" },
        `<div class="danger-row"><button class="chip chip-danger" onclick="go404()">Sign out every session</button><button class="chip chip-danger" onclick="go404()">Rotate system keys</button></div>`)}
    </div>
  </div>`;
}

/* =========================================================
   SETTINGS
   ========================================================= */
function renderSettings() {
  const s = state.settings;
  const displayName = currentUsername || currentEmail || "Signed out";
  const displayEmail = currentEmail || "No account signed in";
  return `<div class="layout layout-even">
    ${panel({ kicker: "Profile", title: "Account", sub: "The profile signed in on this device" },
      `<div class="account">
        <span class="seal lg">${currentInitial}</span>
        <div>
          <span class="account-name">${esc(displayName)}</span>
          <span class="account-email">${esc(displayEmail)}</span>
          <span class="account-role">${currentUser ? (currentRole === 'admin' ? 'Administrator' : 'Operations user') : 'Not signed in'}</span>
        </div>
      </div>
      <button class="chip" onclick="go404()">Edit profile</button>`)}
    ${panel({ kicker: "Preferences", title: "Preferences", sub: "Alerts and how the console reads" },
      `<div class="pref"><div><span class="pref-title">SLA breach alerts</span><span class="pref-desc">Notify me when any client falls below target</span></div>${switchHtml("slaAlerts", s.slaAlerts)}</div>
      <div class="pref"><div><span class="pref-title">Monday digest</span><span class="pref-desc">A summary of the week's billing, renewals and access changes</span></div>${switchHtml("weeklyDigest", s.weeklyDigest)}</div>
      <div class="pref"><div><span class="pref-title">Compact rows</span><span class="pref-desc">Tighter spacing in the register tables</span></div>${switchHtml("compactRows", s.compactRows)}</div>
      <div class="pref pref-last"><div><span class="pref-title">Language</span><span class="pref-desc">Interface display language</span></div>
        <select class="pref-select" id="lang-select">${["English","French","Spanish","Hindi","Polish"].map(function(l){return `<option ${s.language===l?'selected':''}>${l}</option>`;}).join("")}</select></div>`)}
    ${panel({ kicker: "Session", title: "Session", sub: "Sign out of this account on this device" },
      `<div class="session"><p>Signed in as <strong>${esc(displayEmail)}</strong>. Signing out clears the session and returns you to the sign-in screen.</p>
      <button class="chip chip-danger" id="settings-logout-btn">Sign out</button></div>`)}
    ${panel({ kicker: "Danger", title: "Account actions", sub: "These cannot be undone" },
      `<div class="danger-row"><button class="chip chip-danger" onclick="go404()">Reset password</button><button class="chip chip-danger" onclick="go404()">Close account</button></div>`)}
  </div>`;
}

const pageRenderers = {
  dashboard: renderDashboard, clients: renderClients, people: renderPeople, sites: renderSites,
  audit: renderAudit, compliance: renderCompliance, systems: renderSystems, billing: renderBilling,
  security: renderSecurity, settings: renderSettings
};
const pageActions = {
  dashboard: `<button class="btn btn-ghost" onclick="go404()">${ico('download')}Export report</button><button class="btn btn-solid" onclick="go404()">${ico('plus')}Add client</button>`,
  clients:   `<button class="btn btn-solid" onclick="go404()">${ico('plus')}Add client</button>`,
  people:    `<button class="btn btn-solid" onclick="go404()">${ico('plus')}Invite person</button>`,
  sites:     `<button class="btn btn-ghost" onclick="go404()">${ico('download')}Capacity plan</button>`,
  billing:   `<button class="btn btn-solid" onclick="go404()">${ico('plus')}New invoice</button>`
};

/* =========================================================
   SHELL
   ========================================================= */
function badgeFor(id) {
  if (id === "clients") { const n = clients.filter(function (c) { return c.status === "At risk"; }).length; return n ? `<span class="nav-badge">${n}</span>` : ""; }
  if (id === "compliance") { const n = complianceChecks.filter(function (c) { return c.state !== "clear"; }).length; return n ? `<span class="nav-badge alert">${n}</span>` : ""; }
  if (id === "dashboard" && approvals.length) return `<span class="nav-badge">${approvals.length}</span>`;
  return "";
}
function renderNav() {
  document.getElementById("nav-sheet").innerHTML = navGroups.map(function (g) {
    return `<p class="dock-label">${g.label}</p>
      <nav class="dock-nav">${g.items.map(function (i) {
        return `<button class="dock-item ${state.activeNav === i.id ? 'on' : ''}" data-nav="${i.id}">${ico(i.icon, 'dock-ico')}<span class="dock-text">${i.label}</span>${badgeFor(i.id)}</button>`;
      }).join("")}</nav>`;
  }).join("");
}

function renderPage() {
  const page = pageMap[state.activeNav];
  const group = navGroups.filter(function (g) { return g.items.some(function (i) { return i.id === state.activeNav; }); })[0];
  document.getElementById("page-title-text").textContent = page.title;
  document.getElementById("page-sub-text").textContent = page.sub;
  document.getElementById("page-kicker").textContent = "Admin console · " + (group ? group.label : "");
  document.getElementById("page-actions").innerHTML = pageActions[state.activeNav] || "";
  document.title = "Stackly Admin — " + page.title;
  document.getElementById("content-area").innerHTML = pageRenderers[state.activeNav]();
  document.body.classList.toggle('compact', !!state.settings.compactRows);
  renderNav();
  const settingsLogoutBtn = document.getElementById("settings-logout-btn");
  if (settingsLogoutBtn) settingsLogoutBtn.addEventListener("click", logout);
  window.scrollTo({ top: 0, left: 0, behavior: "instant" });
  syncTopbarHeight();
  fillBars();
  entrance();
}

function navigateTo(id) {
  state.activeNav = id;
  try { localStorage.setItem('activeNav', id); } catch (e) {}
  closeMenu();
  closeWhoami();
  renderPage();
}

/* ---- access requests: approve / decline ---- */
function resolveRequest(id, approved) {
  const req = approvals.filter(function (r) { return r.id === id; })[0];
  if (!req) return;
  const row = document.querySelector('[data-req="' + id + '"]');
  function finish() {
    approvals = approvals.filter(function (r) { return r.id !== id; });
    auditTrail.unshift({
      time: "Just now", actor: "Admin (You)",
      action: approved ? "Approved an access request" : "Declined an access request",
      target: req.who + " — " + req.what, scope: req.site
    });
    document.getElementById("approvals-box").innerHTML = approvalsHtml();
    document.getElementById("approval-count").textContent = approvals.length;
    const trail = document.getElementById("overview-trail");
    if (trail) trail.innerHTML = trailHtml(auditTrail.slice(0, 5));
    renderNav();
    toast((approved ? "Approved " : "Declined ") + id + " for " + req.who);
  }
  if (row && typeof gsap !== 'undefined') {
    row.classList.add(approved ? 'is-yes' : 'is-no');
    gsap.to(row, { opacity: 0, x: approved ? 24 : -24, height: 0, paddingTop: 0, paddingBottom: 0, marginTop: 0, duration: 0.4, ease: 'power2.in', onComplete: finish });
  } else {
    finish();
  }
}

/* ---- sidebar: fixed on desktop, hamburger drawer at 1100px and below ---- */
const MENU_BREAK = 1100;
let savedScrollY = 0;
function lockScroll() {
  savedScrollY = window.scrollY || window.pageYOffset || 0;
  document.documentElement.classList.add("nav-open");
  document.body.classList.add("nav-open");
}
function unlockScroll() {
  if (!document.body.classList.contains("nav-open")) return;
  document.documentElement.classList.remove("nav-open");
  document.body.classList.remove("nav-open");
  window.scrollTo(0, savedScrollY);
}
function openMenu() {
  const sheet = document.getElementById("menu-sheet");
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  document.getElementById("sidebar-overlay").classList.add("show");
  const btn = document.getElementById("hamburger-btn");
  btn.classList.add("is-open");
  btn.setAttribute("aria-expanded", "true");
  btn.setAttribute("aria-label", "Close menu");
  lockScroll();
}
function closeMenu() {
  const sheet = document.getElementById("menu-sheet");
  if (!sheet.classList.contains("open")) return;
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  document.getElementById("sidebar-overlay").classList.remove("show");
  const btn = document.getElementById("hamburger-btn");
  btn.classList.remove("is-open");
  btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-label", "Open menu");
  unlockScroll();
}
function closeWhoami() { document.getElementById("topbar-user").classList.remove("open"); }

document.getElementById("hamburger-btn").addEventListener("click", function () {
  if (document.getElementById("menu-sheet").classList.contains("open")) closeMenu(); else openMenu();
});
document.getElementById("sidebar-overlay").addEventListener("click", closeMenu);
document.getElementById("brand-home-btn").addEventListener("click", function () { navigateTo("dashboard"); });
document.getElementById("notif-btn").addEventListener("click", go404);
document.getElementById("logout-btn").addEventListener("click", logout);
document.getElementById("topbar-logout-btn").addEventListener("click", logout);
document.getElementById("topbar-user-btn").addEventListener("click", function (e) {
  e.stopPropagation();
  document.getElementById("topbar-user").classList.toggle("open");
});
document.addEventListener("click", closeWhoami);
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeMenu(); closeWhoami(); } });
function syncDock() {
  const sheet = document.getElementById("menu-sheet");
  const fixed = window.innerWidth > MENU_BREAK;
  if (fixed) closeMenu();
  sheet.setAttribute("aria-hidden", fixed || sheet.classList.contains("open") ? "false" : "true");
}
window.addEventListener("resize", function () {
  syncDock();
  syncTopbarHeight();
});
syncDock();
window.addEventListener("orientationchange", syncTopbarHeight);
window.addEventListener("load", syncTopbarHeight);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTopbarHeight);

/* ---- topbar search: on phones the magnifier opens the field first ---- */
(function () {
  const form = document.getElementById("topbar-search");
  const input = document.getElementById("topbar-search-input");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (window.innerWidth <= 720 && !form.classList.contains("expanded")) { form.classList.add("expanded"); input.focus(); return; }
    if (!input.value.trim()) { input.focus(); return; }
    go404();
  });
  input.addEventListener("blur", function () { if (!input.value.trim()) form.classList.remove("expanded"); });
})();

/* ---- delegated clicks ---- */
document.addEventListener("click", function (e) {
  const yes = e.target.closest("[data-approve]");
  if (yes) { resolveRequest(yes.getAttribute("data-approve"), true); return; }
  const no = e.target.closest("[data-decline]");
  if (no) { resolveRequest(no.getAttribute("data-decline"), false); return; }
  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
  const filterBtn = e.target.closest(".client-filter");
  if (filterBtn) { state.clientFilter = filterBtn.getAttribute("data-client-filter"); renderPage(); return; }
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) { flipSwitch(toggle); return; }
});
document.addEventListener("keydown", function (e) {
  const toggle = e.target.closest && e.target.closest("[data-toggle]");
  if (toggle && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flipSwitch(toggle); }
});
function flipSwitch(toggle) {
  const key = toggle.getAttribute("data-toggle");
  state.settings[key] = !state.settings[key];
  saveSettings();
  toggle.classList.toggle("on", state.settings[key]);
  toggle.setAttribute("aria-checked", String(state.settings[key]));
  if (key === "compactRows") document.body.classList.toggle("compact", state.settings[key]);
  // CSS animation rather than GSAP, so no inline transform strands the knob
  const knob = toggle.querySelector('.switch-knob');
  if (knob) { knob.classList.remove('pop'); void knob.offsetWidth; knob.classList.add('pop'); }
}
document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "user-search-input") { state.peopleSearch = e.target.value; updatePeopleRows(); }
});
document.addEventListener("change", function (e) {
  if (e.target && e.target.id === "lang-select") { state.settings.language = e.target.value; saveSettings(); }
  if (e.target && e.target.id === "timeout-select") { state.settings.sessionTimeout = e.target.value; saveSettings(); }
});

/* ---- boot ---- */
paintUserChrome();
if (typeof gsap !== 'undefined') {
  gsap.from('.head-bar', { y: -14, opacity: 0, duration: 0.5, ease: 'power2.out' });
}
renderPage();
syncTopbarHeight();
</script>
</body>
</html>
