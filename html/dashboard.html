    </div>

    <div class="head-right">
      <form class="finder" id="topbar-search" autocomplete="off" role="search">
        <button type="submit" class="finder-go" id="finder-go" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
        </button>
        <input id="topbar-search-input" placeholder="Search tickets, clients, agents…">
        <kbd class="finder-key">/</kbd>
      </form>
      <button class="icon-btn" id="notif-btn" aria-label="Alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
        <span class="icon-dot"></span>
      </button>
      <div class="whoami" id="topbar-user">
        <button class="whoami-btn" id="topbar-user-btn" aria-haspopup="true">
          <span class="avatar sm" id="topbar-user-avatar">–</span>
          <span class="whoami-text">
            <span class="whoami-name" id="topbar-user-name">Signed out</span>
            <span class="whoami-role" id="topbar-user-role">Operations</span>
          </span>
          <svg class="whoami-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>
        </button>

            <span class="whoami-menu-email" id="topbar-user-email">—</span>
          </div>
          <button class="whoami-item" data-nav="settings">Settings</button>
          <button class="whoami-item danger" id="topbar-logout-btn">Sign out</button>
        </div>
      </div>
    </div>
  </div>

/* =========================================================
   SIGNED-IN USER LOOKUP
   Same behaviour as before: checks the usual key names across
   localStorage then sessionStorage, accepts a JSON object or a
   bare address, digs into nested objects, and finally sweeps
   every key for something that looks like an address.
   ========================================================= */
const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
const USER_KEY_CANDIDATES = [
  'user', 'currentUser', 'loggedInUser', 'authUser', 'stacklyUser',
  'userData', 'profile', 'account', 'auth', 'session',
  'userEmail', 'email', 'username'
];
const EMAIL_FIELDS = ['email', 'mail', 'useremail', 'emailaddress', 'e-mail', 'username', 'login', 'user'];
const NAME_FIELDS = ['name', 'fullname', 'displayname', 'firstname', 'givenname'];
let foundUserKey = null;

function asEmail(v) {
  if (typeof v !== 'string') return null;
  const s = v.trim();
  return EMAIL_RE.test(s) ? s : null;
}
function objToUser(obj, depth) {
  depth = depth || 0;
  if (!obj || depth > 4) return null;
  if (typeof obj === 'string') {
    const direct = asEmail(obj);
    if (direct) return { email: direct };
    return rawToUser(obj, depth + 1);
  }
  if (Array.isArray(obj)) {
    for (let i = 0; i < obj.length; i++) {
      const hit = objToUser(obj[i], depth + 1);
      if (hit) return hit;
    }
    return null;
  }
  if (typeof obj !== 'object') return null;
  for (const k in obj) {
    if (EMAIL_FIELDS.indexOf(String(k).toLowerCase()) === -1) continue;
    const hit = asEmail(obj[k]);
    if (hit) return Object.assign({}, obj, { email: hit });
  }
  for (const k in obj) {
    const hit = asEmail(obj[k]);
    if (hit) return Object.assign({}, obj, { email: hit });
  }
  for (const k in obj) {
    const v = obj[k];
    if (v && typeof v === 'object') {
      const nested = objToUser(v, depth + 1);
      if (nested) return nested;
    } else if (typeof v === 'string' && (v.trim().charAt(0) === '{' || v.trim().charAt(0) === '[')) {
      const nested = rawToUser(v, depth + 1);
      if (nested) return nested;
    }
  }
  return null;
}
function rawToUser(raw, depth) {
  depth = depth || 0;
  if (!raw || depth > 4) return null;
  const trimmed = String(raw).trim();
  if (!trimmed) return null;
  const first = trimmed.charAt(0);
  if (first === '{' || first === '[' || first === '"') {
    try { return objToUser(JSON.parse(trimmed), depth); } catch (e) {}
  }
  const direct = asEmail(trimmed);
  if (direct) return { email: direct };
  try { return objToUser(JSON.parse(trimmed), depth); } catch (e) { return null; }
}
function pickName(obj) {
  if (!obj || typeof obj !== 'object') return '';
  for (const k in obj) {
    if (NAME_FIELDS.indexOf(String(k).toLowerCase()) === -1) continue;
    const v = obj[k];
    if (typeof v === 'string' && v.trim() && !asEmail(v)) return v.trim();
  }
  return '';
}
function getCurrentUser() {
  const stores = [];
  try { if (window.localStorage) stores.push(localStorage); } catch (e) {}
  try { if (window.sessionStorage) stores.push(sessionStorage); } catch (e) {}
  for (let s = 0; s < stores.length; s++) {
    try { if (stores[s].getItem('isAuthenticated') === 'false') return null; } catch (e) {}
  }
  for (let s = 0; s < stores.length; s++) {
    for (let i = 0; i < USER_KEY_CANDIDATES.length; i++) {
      const key = USER_KEY_CANDIDATES[i];
      let hit = null;
      try { hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
      if (hit) { foundUserKey = key; return hit; }
    }
  }
  for (let s = 0; s < stores.length; s++) {
    let len = 0;
    try { len = stores[s].length; } catch (e) {}
    for (let i = 0; i < len; i++) {
      let key = null, hit = null;
      try { key = stores[s].key(i); hit = rawToUser(stores[s].getItem(key)); } catch (e) {}
      if (hit) { foundUserKey = key; return hit; }
    }
  }
  return null;
}
function usernameFromEmail(email) { if (!email) return ''; return email.includes('@') ? email.split('@')[0] : email; }

function entrance() {
  if (typeof gsap === 'undefined') return;
  gsap.killTweensOf('.kpi, .card, .row-anim');
  gsap.fromTo('.page-head', { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' });
  gsap.fromTo('.hello', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' });
  gsap.fromTo('.kpi', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', stagger: 0.06 });
  gsap.fromTo('.card', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: 'power3.out', stagger: 0.06, delay: 0.08 });
  gsap.fromTo('.row-anim', { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out', stagger: 0.025, delay: 0.18 });

  document.querySelectorAll('.kpi-value').forEach(function (el) {
    const raw = el.textContent.trim();
    const match = raw.match(/^([^\d]*)([\d,]+\.?\d*)(.*)$/);
    if (!match) return;
    const prefix = match[1], numStr = match[2].replace(/,/g, ''), suffix = match[3];
    const num = parseFloat(numStr);
    if (isNaN(num)) return;
    const decimals = numStr.indexOf('.') > -1 ? numStr.split('.')[1].length : 0;
    const counter = { val: 0 };
    gsap.to(counter, {
      val: num, duration: 1.1, ease: 'power2.out', delay: 0.1,
      onUpdate: function () {
        const shown = decimals ? counter.val.toFixed(decimals) : Math.round(counter.val).toLocaleString();
        el.textContent = prefix + shown + suffix;
      },
      onComplete: function () { el.textContent = raw; }
    });
  });
}

  }).join("");
  return `${kpis}
    ${card({ title: "Ticket queue", sub: sub, icon: "ticket", cls: "card-table", aside: `<label class="finder finder-inline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="ticket-search-input" placeholder="Client, priority, owner, status…" value="${state.ticketSearch.replace(/"/g, '&quot;')}">
        </label>` },
      `<div class="table-wrap"><table class="table">
        <thead><tr><th>Ticket</th><th>Subject</th><th>Channel</th><th>Priority</th><th>Time left</th><th>Status</th><th>Owner</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7" class="empty">Nothing matches that search.</td></tr>'}</tbody></table></div>`)}`;
}

/* =========================================================
   CLIENTS
   ========================================================= */
function renderClients() {
  const hours = clients.reduce(function (a, c) { return a + c.hours; }, 0);
  const used = clients.reduce(function (a, c) { return a + c.used; }, 0);
  const kpis = kpiRow([
    { label: "Client accounts",      value: String(clients.length), icon: "building" },
    { label: "Seats in service",     value: String(clients.reduce(function(a,c){return a+c.seats;},0)), icon: "headset", color: "#5ad0ff" },
    { label: "Contract hours used",  value: Math.round(used / hours * 100) + "%", icon: "clock", note: used.toLocaleString() + " of " + hours.toLocaleString() + " hrs", color: "#a79bff" },
    { label: "Meeting SLA",          value: clients.filter(function(c){return c.sla >= c.target;}).length + "/" + clients.length, icon: "gauge", color: "#ffb547" }
  ]);
  const cards = clients.map(function (c) {
    const pct = Math.round(c.used / c.hours * 100);
    const cls = slaClass(c.sla, c.target);
    return `<article class="client row-anim" onclick="go404()">
      <header>
        <span class="client-code">${c.code}</span>
        <span class="client-id"><span class="client-name">${c.name}</span><span class="client-svc">${c.service}</span></span>
        ${channelTag(c.channel)}
      </header>
      <div class="client-sla">
        <span>Service level</span>
        <b class="${cls}">${c.sla}%</b>
        <em>target ${c.target}%</em>
      </div>
      <div class="client-hours">
        <div class="client-hours-top"><span>Contract hours this month</span><span><b>${c.used.toLocaleString()}</b> / ${c.hours.toLocaleString()}</span></div>
        <span class="mini-track wide"><span class="mini-fill ${pct > 90 ? 'bad' : 'good'}" data-w="${pct}"></span></span>
      </div>
      <footer><span>${c.seats} seats</span><span>Manager · ${c.manager}</span></footer>
    </article>`;
  }).join("");
  return `${kpis}${card({ title: "Client accounts", sub: "Service level and contract usage", icon: "building" }, `<div class="client-grid">${cards}</div>`)}`;
}

/* =========================================================
   QUALITY
   ========================================================= */
function renderQuality() {
  const avg = Math.round(audits.reduce(function (a, q) { return a + q.score; }, 0) / audits.length);
  const kpis = kpiRow([
    { label: "Average QA score", value: avg + "%", icon: "star", bar: avg },
    { label: "Audits this week", value: String(audits.length * 7), icon: "doc", color: "#5ad0ff" },
    { label: "Below 80%",        value: String(audits.filter(function(q){return q.score < 80;}).length), icon: "alert", note: "coaching booked", color: "#ff6b81" },
    { label: "First contact resolution", value: "78%", icon: "smile", color: "#ffb547", bar: 78 }
  ]);
  const rows = audits.map(function (q) {
    const cls = q.score >= 90 ? 'good' : q.score >= 80 ? 'warn' : 'bad';
    return `<li class="audit row-anim" onclick="go404()">
      <span class="score score-${cls}">${q.score}</span>
      <span class="audit-main"><span class="audit-agent">${q.agent}</span><span class="audit-sub">${q.type} · ${q.client}</span></span>
      <span class="audit-side"><span>${q.date}</span><em>by ${q.auditor}</em></span>
    </li>`;
  }).join("");
  return `${kpis}${card({ title: "Recent audits", sub: "90% and above passes, below 80% goes to coaching", icon: "star" }, `<ul class="audit-list">${rows}</ul>`)}`;
}

/* =========================================================
   SHIFTS — a day timeline, 06:00 to 22:00
   ========================================================= */
function renderShifts() {
  const from = 6, to = 22, span = to - from;
  const planned = shifts.reduce(function (a, s) { return a + s.planned; }, 0);
  const actual = shifts.reduce(function (a, s) { return a + s.actual; }, 0);
  const kpis = kpiRow([
    { label: "Shifts today",     value: String(shifts.length), icon: "cal" },
    { label: "Planned headcount", value: String(planned), icon: "headset", color: "#5ad0ff" },
    { label: "Logged in",        value: String(actual), icon: "phone", color: "#a79bff" },
    { label: "Adherence",        value: Math.round(actual / planned * 100) + "%", icon: "gauge", color: "#ffb547", bar: Math.round(actual / planned * 100) }
  ]);
  const hours = [];
  for (let h = from; h <= to; h += 2) hours.push(`<span style="left:${(h - from) / span * 100}%">${String(h).padStart(2, '0')}:00</span>`);
  const rows = shifts.map(function (s) {
    const left = (s.start - from) / span * 100, width = (s.end - s.start) / span * 100;
    const short = s.actual < s.planned;
    return `<div class="shift row-anim" onclick="go404()">
      <div class="shift-name"><b>${s.team}</b><span class="${short ? 'bad' : 'good'}">${s.actual}/${s.planned} in</span></div>
      <div class="shift-lane"><span class="shift-bar ${short ? 'short' : ''}" style="left:${left}%;width:${width}%">${String(s.start).padStart(2,'0')}:00 – ${String(s.end).padStart(2,'0')}:00</span></div>
    </div>`;
  }).join("");
  return `${kpis}${card({ title: "Today's roster", sub: "Amber bars are running short of planned headcount", icon: "cal" },
    `<div class="timeline"><div class="timeline-hours">${hours.join("")}</div>${rows}</div>`)}`;
}

/* =========================================================
   REPORTS
   ========================================================= */
function renderReports() {
  const kpis = kpiRow([
    { label: "Reports",        value: String(reports.length), icon: "doc" },
    { label: "Ready to send",  value: String(reports.filter(function(r){return r.status==="Ready";}).length), icon: "download", color: "#5ad0ff" },
    { label: "In review",      value: String(reports.filter(function(r){return r.status==="In review";}).length), icon: "star", color: "#ffb547" },
    { label: "Scheduled runs", value: "24", icon: "cal", note: "each week", color: "#a79bff" }
  ]);
  const rows = reports.map(function (r) {
    const c = reportStatusColor[r.status];
    return `<article class="report row-anim" onclick="go404()">
      <span class="report-ico">${ico('doc')}</span>
      <span class="report-main"><span class="report-title">${r.title}</span><span class="report-sub">${r.owner} · ${r.cadence} · last run ${r.last}</span></span>
      <span class="badge" style="--c:${c}">${r.status}</span>
      <button class="chip" onclick="event.stopPropagation();go404()">Open</button>
    </article>`;
  }).join("");
  return `${kpis}${card({ title: "Report library", sub: "Client packs, QA and finance reports", icon: "doc" }, `<div class="report-list">${rows}</div>`)}`;
}

/* =========================================================
   SETTINGS
   ========================================================= */
function switchHtml(id, value) {
  return `<span class="switch ${value ? 'on' : ''}" data-toggle="${id}" role="switch" aria-checked="${value}" tabindex="0"><span class="switch-knob"></span></span>`;
}
function renderSettings() {
  const s = state.settings;
  const displayName = currentUsername || currentEmail || "Signed out";
  const displayEmail = currentEmail || "No account signed in";
  return `<div class="grid grid-settings">
    ${card({ title: "Account", sub: "The profile signed in on this device", icon: "headset" },
      `<div class="account">
        <span class="avatar lg">${currentInitial}</span>
        <div>
          <span class="account-name">${displayName}</span>
          <span class="account-email">${displayEmail}</span>
          <span class="account-role">${currentUser ? (currentUser.role === 'admin' ? 'Administrator' : 'Operations user') : 'Not signed in'}</span>
        </div>
      </div>
      <button class="chip" onclick="go404()">Edit profile</button>`)}

    ${card({ title: "Preferences", sub: "Alerts and how the desk reads", icon: "gear" },
      `<div class="pref"><div><span class="pref-title">SLA alerts</span><span class="pref-desc">Notify me when a queue is at risk of breaching</span></div>${switchHtml("slaAlerts", s.slaAlerts)}</div>
      <div class="pref"><div><span class="pref-title">End-of-day digest</span><span class="pref-desc">A summary of volumes and service levels at 18:00</span></div>${switchHtml("dailyDigest", s.dailyDigest)}</div>
      <div class="pref"><div><span class="pref-title">Compact rows</span><span class="pref-desc">Tighter spacing in the queue and ticket tables</span></div>${switchHtml("compactRows", s.compactRows)}</div>
      <div class="pref pref-last"><div><span class="pref-title">Language</span><span class="pref-desc">Interface display language</span></div>
        <select class="pref-select" id="lang-select">${["English","French","Spanish","Hindi","Portuguese"].map(function(l){return `<option ${s.language===l?'selected':''}>${l}</option>`;}).join("")}</select></div>`)}

    ${card({ title: "Session", sub: "Sign out of this account on this device", icon: "clock" },
      `<div class="session"><p>Signed in as <strong>${displayEmail}</strong>. Signing out clears the session and returns you to the sign-in screen.</p>
      <button class="chip chip-danger" id="settings-logout-btn">Sign out</button></div>`)}

    ${card({ title: "Account actions", sub: "These cannot be undone", icon: "alert" },
      `<div class="danger-row"><button class="chip chip-danger" onclick="go404()">Reset password</button><button class="chip chip-danger" onclick="go404()">Close account</button></div>`)}
  </div>`;
}

const pageRenderers = {
  dashboard: renderDashboard, queues: renderQueues, agents: renderAgents, tickets: renderTickets,
  clients: renderClients, quality: renderQuality, shifts: renderShifts, reports: renderReports, settings: renderSettings
};

/* =========================================================
   SHELL
   ========================================================= */
function badgeHtml(item) {
  const n = item.badge ? item.badge() : 0;
  return n ? `<span class="nav-badge">${n}</span>` : '';
}
function renderNav() {
  document.getElementById("nav-drawer").innerHTML = Object.keys(navGroups).map(function (g) {
    return `<p class="dock-label">${groupLabels[g]}</p>
      <nav class="dock-nav">${navGroups[g].map(function (i) {
        return `<button class="dock-item ${state.activeNav === i.id ? 'on' : ''}" data-nav="${i.id}">${ico(i.icon, 'dock-ico')}<span class="dock-text">${i.label}</span>${badgeHtml(i)}</button>`;
      }).join("")}</nav>`;
  }).join("");
}

function renderPage() {
  const page = pageMap[state.activeNav];
  document.getElementById("page-title-text").textContent = page.title;
  const group = Object.keys(navGroups).filter(function (g) { return navGroups[g].some(function (i) { return i.id === state.activeNav; }); })[0];
  document.getElementById("page-sub-text").textContent = page.sub;
  document.getElementById("page-kicker").textContent = "Operations desk · " + (groupLabels[group] || "");
  document.getElementById("page-actions").innerHTML = pageActions[state.activeNav] || "";
  document.title = "Stackly — " + page.title;
  document.getElementById("content-area").innerHTML = pageRenderers[state.activeNav]();
  document.body.classList.toggle('compact', !!state.settings.compactRows);
  renderNav();
  const settingsLogoutBtn = document.getElementById("settings-logout-btn");
  if (settingsLogoutBtn) settingsLogoutBtn.addEventListener("click", logout);
  window.scrollTo({ top: 0, left: 0, behavior: "instant" });
  fillBars();
  entrance();
}

function navigateTo(id) {
  state.activeNav = id;
  writeStore('activeNav', id);
  closeDrawer();
  closeWhoami();
  renderPage();
}

/* ---- sidebar: fixed on desktop, hamburger drawer at 1100px and below ---- */
const MENU_BREAK = 1100;
const burger = document.getElementById("hamburger-btn");
let savedScrollY = 0;

function lockScroll() {
  savedScrollY = window.scrollY || window.pageYOffset || 0;
  document.documentElement.classList.add("nav-open");
  document.body.classList.add("nav-open");
}
function unlockScroll() {
  if (!document.body.classList.contains("nav-open")) return;
  document.documentElement.classList.remove("nav-open");
  document.body.classList.remove("nav-open");
  window.scrollTo(0, savedScrollY);
}
function openDrawer() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebar-overlay").classList.add("show");
  document.getElementById("sidebar").setAttribute("aria-hidden", "false");
  burger.classList.add("is-open");
  burger.setAttribute("aria-expanded", "true");
  burger.setAttribute("aria-label", "Close menu");
  lockScroll();
}
function closeDrawer() {
  if (!document.getElementById("sidebar").classList.contains("open")) return;
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar").setAttribute("aria-hidden", "true");
  document.getElementById("sidebar-overlay").classList.remove("show");
  burger.classList.remove("is-open");
  burger.setAttribute("aria-expanded", "false");
  burger.setAttribute("aria-label", "Open menu");
  unlockScroll();
}
function closeWhoami() { document.getElementById("topbar-user").classList.remove("open"); }

burger.addEventListener("click", function () {
  if (document.getElementById("sidebar").classList.contains("open")) {
    closeDrawer();
  } else {
    openDrawer();
  }
});
document.getElementById("brand-home-btn").addEventListener("click", function () { navigateTo("dashboard"); });
function syncDock() {
  const fixed = window.innerWidth > MENU_BREAK;
  if (fixed) closeDrawer();
  document.getElementById("sidebar").setAttribute("aria-hidden", fixed || document.getElementById("sidebar").classList.contains("open") ? "false" : "true");
}
window.addEventListener("resize", syncDock);
syncDock();
document.getElementById("sidebar-overlay").addEventListener("click", closeDrawer);
document.getElementById("notif-btn").addEventListener("click", go404);
document.getElementById("logout-btn").addEventListener("click", logout);
document.getElementById("topbar-logout-btn").addEventListener("click", logout);
document.getElementById("topbar-user-btn").addEventListener("click", function (e) {
  e.stopPropagation();
  document.getElementById("topbar-user").classList.toggle("open");
});
document.addEventListener("click", closeWhoami);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeDrawer(); closeWhoami(); }
  const typing = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); openFinder(); }
});

/* ---- topbar search: on phones the magnifier opens the field first ---- */
const finder = document.getElementById("topbar-search");
const finderInput = document.getElementById("topbar-search-input");
function openFinder() { finder.classList.add("expanded"); finderInput.focus(); }
finder.addEventListener("submit", function (e) {
  e.preventDefault();
  if (window.innerWidth <= 720 && !finder.classList.contains("expanded")) { openFinder(); return; }
  if (!finderInput.value.trim()) { finderInput.focus(); return; }
  go404();
});
finderInput.addEventListener("blur", function () { if (!finderInput.value.trim()) finder.classList.remove("expanded"); });

/* ---- chart tooltip ---- */
const tip = document.getElementById("chart-tip");
function showTip(el) {
  tip.textContent = el.getAttribute("data-tip");
  const r = el.getBoundingClientRect();
  tip.classList.add("show");
  const w = tip.offsetWidth;
  let x = r.left + r.width / 2 - w / 2;
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
  tip.style.left = x + "px";
  tip.style.top = (r.top - tip.offsetHeight - 8 + window.scrollY) + "px";
}
function hideTip() { tip.classList.remove("show"); }
document.addEventListener("mouseover", function (e) { const t = e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("mouseout", function (e) { if (e.target.closest("[data-tip]")) hideTip(); });
document.addEventListener("focusin", function (e) { const t = e.target.closest && e.target.closest("[data-tip]"); if (t) showTip(t); });
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, { passive: true });

/* ---- delegated clicks ---- */
document.addEventListener("click", function (e) {
  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
  const qf = e.target.closest(".queue-filter");
  if (qf) { state.queueChannel = qf.getAttribute("data-filter"); renderPage(); return; }
  const af = e.target.closest(".agent-filter");
  if (af) { state.agentStatus = af.getAttribute("data-filter"); renderPage(); return; }
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) { flipSwitch(toggle); return; }
});
document.addEventListener("keydown", function (e) {
  const toggle = e.target.closest && e.target.closest("[data-toggle]");
  if (toggle && (e.key === " " || e.key === "Enter")) { e.preventDefault(); flipSwitch(toggle); }
});
function flipSwitch(toggle) {
  const key = toggle.getAttribute("data-toggle");
  state.settings[key] = !state.settings[key];
  saveSettings();
  toggle.classList.toggle("on", state.settings[key]);
  toggle.setAttribute("aria-checked", String(state.settings[key]));
  if (key === "compactRows") document.body.classList.toggle("compact", state.settings[key]);
  // CSS animation rather than GSAP, so no inline transform strands the knob
  const knob = toggle.querySelector('.switch-knob');
  if (knob) { knob.classList.remove('pop'); void knob.offsetWidth; knob.classList.add('pop'); }
}

document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "ticket-search-input") {
    state.ticketSearch = e.target.value;
    const caretPos = e.target.selectionStart;
    renderPage();
    const input = document.getElementById("ticket-search-input");
    if (input) { input.focus(); input.setSelectionRange(caretPos, caretPos); }
  }
});
document.addEventListener("change", function (e) {
  if (e.target && e.target.id === "lang-select") { state.settings.language = e.target.value; saveSettings(); }
});

/* ---- boot ---- */
paintUserChrome();
if (typeof gsap !== 'undefined') {
  gsap.from('.head-bar', { y: -14, opacity: 0, duration: 0.5, ease: 'power2.out' });
}
renderPage();
</script>
</body>
</html>
